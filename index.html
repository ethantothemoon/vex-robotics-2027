<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Sunset Robotics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #6B3410 0%, #8B4513 15%, #A0522D 30%, #CD853F 60%, #DAA520 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Wavy decorative lines - LEFT SIDE */
        .deco-left {
            position: absolute;
            left: 20px;
            top: 80px;
            width: 80px;
            height: 350px;
            pointer-events: none;
        }

        .deco-left svg {
            width: 100%;
            height: 100%;
        }

        /* Wavy decorative lines - RIGHT SIDE */
        .deco-right {
            position: absolute;
            right: 20px;
            top: 80px;
            width: 100px;
            height: 350px;
            pointer-events: none;
        }

        .deco-right svg {
            width: 100%;
            height: 100%;
        }

        /* HEADER */
        header {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 50px;
            border: 3px solid #4B0082;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 100px;
            position: relative;
            z-index: 5;
        }

        .content-container {
            display: flex;
            gap: 100px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* ILLUSTRATION BOX */
        .illustration-box {
            flex-shrink: 0;
            position: relative;
        }

        .illustration {
            width: 320px;
            height: 280px;
            background: linear-gradient(180deg, #87CEEB 0%, #ADD8E6 40%, #90EE90 65%, #76D94A 100%);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Cloud */
        .cloud {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: white;
            border-radius: 50px;
            box-shadow: inset -5px -5px 15px rgba(200, 200, 200, 0.3);
        }

        /* Wavy grass */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #90EE90;
        }

        .grass::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 40px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40"><path d="M0,20 Q40,0 80,20 T160,20 T240,20 T320,20" stroke="none" fill="%2376D94A"/><path d="M0,20 Q40,10 80,20 T160,20 T240,20 T320,20" stroke="none" fill="%2390EE90"/></svg>');
            background-size: 160px 40px;
            background-repeat: repeat-x;
        }

        /* TEXT CONTENT */
        .text-content {
            flex: 1;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .text-content h1 {
            font-size: 72px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .text-content p {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* FOOTER */
        footer {
            background: #000;
            color: white;
            padding: 25px 50px;
            border-top: 3px solid #4B0082;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .footer-questions {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .footer-contact {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .content-container {
                flex-direction: column;
                gap: 50px;
            }

            .text-content h1 {
                font-size: 56px;
            }

            main {
                padding: 60px 40px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 15px;
            }

            nav {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .deco-left, .deco-right {
                opacity: 0.3;
            }

            .text-content h1 {
                font-size: 40px;
            }

            .text-content p {
                font-size: 16px;
            }

            .illustration {
                width: 250px;
                height: 220px;
            }
        }
    </style>
</head>

    </div>
