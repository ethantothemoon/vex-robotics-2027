<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Sunset Robotics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #5D3A1A 0%, #8B4513 10%, #A0522D 25%, #B8860B 45%, #CD853F 65%, #DAA520 85%, #D4A574 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* LEFT DECORATIVE LINES */
        .deco-left {
            position: absolute;
            left: 30px;
            top: 100px;
            width: 70px;
            height: 380px;
            pointer-events: none;
            z-index: 1;
        }

        .deco-left svg {
            width: 100%;
            height: 100%;
        }

        /* RIGHT DECORATIVE WAVES */
        .deco-right {
            position: absolute;
            right: 25px;
            top: 100px;
            width: 90px;
            height: 380px;
            pointer-events: none;
            z-index: 1;
        }

        .deco-right svg {
            width: 100%;
            height: 100%;
        }

        /* HEADER */
        header {
            background: rgba(0, 0, 0, 0.15);
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .logo {
            color: white;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            opacity: 0.8;
        }

        nav a:before {
            content: '| ';
            margin-right: 10px;
        }

        nav a:first-of-type:before {
            content: '';
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
            z-index: 5;
        }

        .content-container {
            display: flex;
            gap: 120px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
        }

        /* ILLUSTRATION BOX */
        .illustration-box {
            flex-shrink: 0;
            position: relative;
        }

        .illustration {
            width: 340px;
            height: 280px;
            background: linear-gradient(180deg, #87CEEB 0%, #ADD8E6 45%, #90EE90 60%, #76D94A 100%);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        /* Cloud */
        .cloud {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 55px;
            background: white;
            border-radius: 60px;
            box-shadow: inset -8px -8px 20px rgba(200, 200, 200, 0.4);
        }

        /* Grass waves */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: #90EE90;
        }

        .grass::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 0;
            width: 100%;
            height: 50px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50"><path d="M0,25 Q42.5,5 85,25 T170,25 T255,25 T340,25" stroke="none" fill="%2376D94A"/><path d="M0,25 Q42.5,15 85,25 T170,25 T255,25 T340,25" stroke="none" fill="%2390EE90"/><path d="M0,25 Q42.5,35 85,25 T170,25 T255,25 T340,25" stroke="none" fill="%2376D94A"/></svg>');
            background-size: 170px 50px;
            background-repeat: repeat-x;
        }

        /* TEXT CONTENT */
        .text-content {
            flex: 1;
            color: white;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.6);
        }

        .text-content h1 {
            font-size: 80px;
            font-weight: 900;
            line-height: 1.0;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .text-content p {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* FOOTER */
        footer {
            background: #000;
            color: white;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 20;
        }

        .footer-questions {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .footer-contact {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE */
        @media (max-width: 1400px) {
            .content-container {
                gap: 80px;
            }

            .text-content h1 {
                font-size: 68px;
            }

            main {
                padding: 50px 60px;
            }
        }

        @media (max-width: 1024px) {
            .content-container {
                flex-direction: column;
                gap: 60px;
            }

            .text-content h1 {
                font-size: 56px;
            }

            nav {
                gap: 30px;
            }

            nav a {
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 15px 20px;
            }

            .logo {
                font-size: 28px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            nav a {
                font-size: 14px;
            }

            nav a:before {
                content: '';
            }

            .deco-left, .deco-right {
                opacity: 0.2;
                width: 40px;
                left: 10px;
                right: 10px;
            }

            .text-content h1 {
                font-size: 40px;
            }

            .text-content p {
                font-size: 16px;
            }

            .illustration {
                width: 250px;
                height: 220px;
            }

            main {
                padding: 40px 20px;
            }

            footer {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
