:root {
  --sand:  #e8c89a;
  --cream: #f5e8d8;
  --dark:  #0a0a0a;
}

html, body {
  height: 100%;
  font-family: 'Barlow', sans-serif;
  background: var(--dark);
  overflow-x: hidden;
}

/* ════════════════════════════
   PAGE WRAPPER — fills viewport
════════════════════════════ */
.page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 0;
}

/* ════════════════════════════
   BACKGROUND
════════════════════════════ */
.hero-bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 70% 40%, #c8603a 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 60%, #8b3520 0%, transparent 55%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #b5441e 0%, #6b2010 100%);
  z-index: 0;
}
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  opacity: 0.35;
  pointer-events: none;
}

/* ════════════════════════════
   DECORATIVE SHAPES
════════════════════════════ */
.deco {
  position: fixed;
  z-index: 1;
  pointer-events: none;
}
.deco-circle {
  top: 60px; left: 28px;
  width: 170px; height: 170px;
  opacity: 0.18;
}
.deco-waves {
  top: 0; right: 0;
  width: 120px; height: 100vh;
  opacity: 0.22;
}

/* ════════════════════════════
   NAV
════════════════════════════ */
nav {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 20px 48px;
  flex-shrink: 0;
}
.nav-home {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: 0.14em;
  color: var(--cream);
  text-transform: uppercase;
  text-decoration: none;
  margin-right: auto;
}
.nav-links {
  display: flex;
  align-items: center;
  list-style: none;
}
.nav-links li { display: flex; align-items: center; }
.nav-links li + li::before {
  content: '';
  display: block;
  width: 1px; height: 16px;
  background: rgba(245,232,216,0.4);
  margin: 0 28px;
}
.nav-links a {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  color: var(--cream);
  text-transform: uppercase;
  text-decoration: none;
  opacity: 0.88;
  transition: opacity 0.2s;
}
.nav-links a:hover { opacity: 1; text-decoration: underline; }

/* ════════════════════════════
   MAIN CONTENT — landscape two-column
════════════════════════════ */
main {
  position: relative;
  z-index: 10;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 0 48px;
}

/* ── LEFT: Big title ── */
.col-title {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 48px;
  animation: fadeUp 0.65s ease both;
}

h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: clamp(3.8rem, 7.5vw, 7.5rem);
  line-height: 0.92;
  color: var(--cream);
  text-transform: uppercase;
  letter-spacing: -0.01em;
}

/* ── RIGHT: image + bio side by side ── */
.col-right {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 36px;
  animation: fadeUp 0.65s 0.15s ease both;
}

.hero-image {
  width: 260px;
  height: 220px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 16px 56px rgba(0,0,0,0.45);
}
.hero-image img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.hero-image-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(160deg, #b0d8f0 0%, #7ec8e3 40%, #88c57a 70%, #6aaf5e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-bio { max-width: 340px; }
.hero-bio-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.09em;
  color: var(--sand);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.hero-bio p {
  font-size: 0.97rem;
  line-height: 1.7;
  color: rgba(245,232,216,0.78);
}

/* ════════════════════════════
   FOOTER
════════════════════════════ */
footer {
  position: relative;
  z-index: 10;
  background: #000;
  padding: 16px 48px;
  flex-shrink: 0;
}
footer p {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  letter-spacing: 0.12em;
  color: var(--cream);
  text-transform: uppercase;
}

/* ════════════════════════════
   ANIMATION
════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ════════════════════════════
   RESPONSIVE (narrow / mobile)
════════════════════════════ */
@media (max-width: 860px) {
  .page { height: auto; min-height: 100vh; }
  main {
    grid-template-columns: 1fr;
    padding: 32px 24px 48px;
    gap: 36px;
  }
  .col-title { padding-right: 0; }
  .col-right { flex-direction: column; align-items: flex-start; }
  .hero-image { width: 100%; height: 200px; }
  nav { padding: 16px 24px; flex-wrap: wrap; gap: 12px; }
  footer { padding: 16px 24px; }
  .deco-circle { width: 110px; height: 110px; top: 50px; left: 10px; }
}
