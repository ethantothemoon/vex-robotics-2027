<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rising Sunset Robotics</title>

  <!-- Fonts: Anton for big title, Montserrat for other text -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    /* ---------- Reset & base ---------- */
    * { box-sizing: border-box; }
    html,body { height: 100%; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #fff;
      overflow-x: hidden;
    }

    /* ---------- Full-page background: layered sunset + noise ---------- */
    body::before {
      /* layered gradients to approximate the warm multi-stop sunset in the screenshot */
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(1200px 400px at 90% 12%, rgba(20,10,8,0.55), transparent 30%),
        radial-gradient(800px 300px at 10% 20%, rgba(10,6,6,0.45), transparent 30%),
        linear-gradient(135deg,
          #5b3420 0%,
          #8a4f28 18%,
          #b1682f 34%,
          #c98853 56%,
          #d9ab5b 76%,
          #c08858 100%);
      background-blend-mode: normal, overlay, normal;
    }

    /* subtle grain/noise overlay (data URI tiny svg with dots) */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      opacity: 0.28;
      background-image: url("data:image/svg+xml;utf8,\
        <svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'>\
          <defs><pattern id='p' width='6' height='6' patternUnits='userSpaceOnUse'><rect width='6' height='6' fill='none'/><circle cx='1' cy='1' r='0.6' fill='%23ffffff' opacity='0.15'/></pattern></defs>\
          <rect width='100%' height='100%' fill='url(%23p)'/></svg>");
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* ---------- Stage container ---------- */
    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ---------- Header (top bar) ---------- */
    header {
      padding: 22px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    /* small HOME at top-left */
    .home-label {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0,0,0,0.45);
    }

    /* nav centered visually: we center nav by absolute-centering within header */
    nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 20px;
      display: flex;
      gap: 36px;
      align-items: center;
      z-index: 11;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 6px 2px;
    }

    /* vertical separator lines between nav items (exactly like screenshot) */
    nav a + a { position: relative; padding-left: 18px; }
    nav a + a::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: rgba(255,255,255,0.9);
      border-radius: 1px;
      transform: scaleY(0.9);
    }

    /* ---------- Decorative left striped badge (cluster) ---------- */
    .left-badge {
      position: absolute;
      top: 110px;
      left: 36px;
      width: 150px;
      height: 150px;
      z-index: 3;
      pointer-events: none;
      transform: rotate(-6deg);
      opacity: 0.95;
    }

    /* ---------- Decorative right wavy thick lines ---------- */
    .right-waves {
      position: absolute;
      top: 70px;
      right: 28px;
      width: 160px;
      height: 320px;
      z-index: 3;
      pointer-events: none;
      opacity: 0.98;
    }

    /* ---------- Hero/content area ---------- */
    main.hero {
      padding: 48px 80px 40px 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      z-index: 4;
      min-height: calc(100vh - 160px); /* leave room for header+footer */
    }

    .hero-inner {
      width: 1150px; /* match screenshot width feel */
      max-width: calc(100% - 80px);
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 40px;
    }

    /* big title aligned center horizontally in the hero area, but visually sits to the right of the illustration */
    .title-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding-top: 22px;
    }

    h1.title {
      font-family: "Anton", "Arial Black", sans-serif;
      font-size: 120px; /* large */
      line-height: 0.92;
      margin: 0;
      text-align: center;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 6px 6px 18px rgba(0,0,0,0.55);
      transform: translateY(6px);
    }

    /* subtitle text on the right of the illustration in the screenshot (smaller, light) */
    .subtitle {
      font-weight: 600;
      font-size: 18px;
      color: #f0ece8;
      opacity: 0.95;
      text-align: center;
      margin-top: -6px;
    }

    /* ---------- Illustration rounded card (left-of-center) ---------- */
    .card-col {
      width: 360px; /* card+margin in screenshot */
      flex: 0 0 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 90px; /* push card down to match screenshot vertical position */
    }

    .land-card {
      width: 260px;
      height: 220px;
      background: linear-gradient(180deg, #cfe9ff 0%, #bfe7ff 40%, #bde6bb 60%);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.06);
    }

    /* optional soft inner glow to match screenshot fade on top */
    .land-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.12) 20%, transparent 60%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* cloud and hills are SVG inside card for crisp shapes */
    .land-svg { display: block; width:100%; height:100%; }

    /* ---------- Footer: black bar across bottom ---------- */
    footer.site-footer {
      background: #000;
      color: #fff;
      padding: 18px 36px;
      font-weight: 800;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 28px;
      box-shadow: 0 -2px 0 rgba(0,0,0,0.4);
      z-index: 20;
    }

    .footer-left {
      font-size: 18px;
      line-height: 1.05;
    }

    .footer-left .contact {
      display: block;
      margin-top: 8px;
      font-size: 16px;
    }

    /* match the screenshot extra large bold number style on the left contact line */
    .footer-left strong { font-weight: 900; }

    /* small right part (if needed) */
    .footer-right {
      margin-left: auto;
      font-size: 16px;
      font-weight: 700;
      opacity: 0.95;
    }

    /* ---------- Responsiveness & fine-tuning ---------- */
    @media (max-width: 1280px) {
      h1.title { font-size: 96px; }
      .hero-inner { width: 1000px; }
      .card-col { margin-top: 70px; }
    }

    @media (max-width: 900px) {
      nav { top: 16px; gap: 22px; }
      h1.title { font-size: 56px; }
      .land-card { width: 220px; height: 190px; border-radius: 14px; }
      .card-col { width: 280px; flex-basis: 280px; margin-top: 40px; }
      .hero-inner { flex-direction: column; align-items: center; gap: 30px; }
      main.hero { padding: 30px 24px; min-height: calc(100vh - 140px); }
    }

    @media (max-width: 520px) {
      .home-label { font-size: 16px; }
      nav a { font-size: 12px; }
      .subtitle { font-size: 14px; }
      footer.site-footer { flex-direction: column; align-items: stretch; gap: 10px; text-align: left; }
    }

  </style>
</head>
<body>
  <div class="stage">

    <!-- Header -->
    <header>
      <div class="home-label">HOME</div>

      <nav aria-label="Main navigation">
        <a href="#team">MEET THE TEAM</a>
        <a href="#awards">AWARDS</a>
        <a href="#forward">GOING FORWARD</a>
      </nav>
    </header>

    <!-- Decorative left tilted striped badge -->
    <div class="left-badge" aria-hidden="true">
      <!-- composed of two overlapping soft circles clipped with diagonal stripes -->
      <svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="diagStripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-25)">
            <rect width="8" height="8" fill="transparent"/>
            <rect x="0" y="0" width="4" height="8" fill="white" opacity="0.95"/>
          </pattern>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.6" />
          </filter>
        </defs>

        <!-- base blobs -->
        <g fill="none" stroke="none" filter="url(#soft)">
          <circle cx="48" cy="68" r="34" fill="rgba(255,255,255,0.06)"/>
          <circle cx="88" cy="44" r="40" fill="rgba(255,255,255,0.06)"/>
        </g>

        <!-- stripe clipping mask over a rounded cluster -->
        <g transform="translate(6,8)" fill="url(#diagStripes)" opacity="0.95">
          <path d="M30 40
                   a36 36 0 1 0 72 0
                   a26 26 0 1 1 -66 12
                   z" />
        </g>

        <!-- soft outline -->
        <g stroke="rgba(255,255,255,0.08)" stroke-width="1.2" fill="none">
          <circle cx="48" cy="68" r="34"/>
          <circle cx="88" cy="44" r="40"/>
        </g>
      </svg>
    </div>

    <!-- Decorative right wavy thick lines -->
    <div class="right-waves" aria-hidden="true">
      <svg viewBox="0 0 160 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- multiple stroked paths that curve same shape, spaced horizontally -->
          <path d="M140 10 C 120 40, 120 80, 140 110 C 160 140, 160 180, 140 210 C 120 240, 120 280, 140 310" />
          <path d="M150 10 C 130 40, 130 80, 150 110 C 170 140, 170 180, 150 210 C 130 240, 130 280, 150 310" />
          <path d="M160 10 C 140 40, 140 80, 160 110 C 180 140, 180 180, 160 210 C 140 240, 140 280, 160 310" />
          <path d="M130 10 C 110 40, 110 80, 130 110 C 150 140, 150 180, 130 210 C 110 240, 110 280, 130 310" />
        </g>
      </svg>
    </div>

    <!-- Main hero -->
    <main class="hero" role="main">
      <div class="hero-inner">

        <!-- left column: illustration card (rounded image box) -->
        <div class="card-col">
          <div class="land-card" role="img" aria-label="illustration of hills and sky">
            <!-- inline SVG for cloud + rolling hills -->
            <svg class="land-svg" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" >
              <!-- sky gradient -->
              <defs>
                <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#eaf6ff"/>
                  <stop offset="0.6" stop-color="#cfe9ff"/>
                  <stop offset="1" stop-color="#bde6bb"/>
                </linearGradient>
                <linearGradient id="hillA" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" stop-color="#9fc86d"/>
                  <stop offset="1" stop-color="#72a73a"/>
                </linearGradient>
                <linearGradient id="hillB" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" stop-color="#d2f08d"/>
                  <stop offset="1" stop-color="#a8c95a"/>
                </linearGradient>
              </defs>

              <rect width="100%" height="100%" fill="url(#sky)"></rect>

              <!-- cloud -->
              <g transform="translate(90,40)">
                <ellipse cx="60" cy="30" rx="40" ry="20" fill="#ffffff"/>
                <ellipse cx="35" cy="36" rx="28" ry="16" fill="#ffffff"/>
                <ellipse cx="90" cy="36" rx="28" ry="16" fill="#ffffff"/>
              </g>

              <!-- hills: layered bezier shapes near bottom -->
              <path d="M0 220 C70 200 110 200 200 220 C280 240 320 200 360 220 L360 300 L0 300 Z" fill="url(#hillA)"/>
              <path d="M0 250 C70 230 120 230 200 250 C280 270 320 230 360 250 L360 300 L0 300 Z" fill="url(#hillB)" opacity="0.95"/>
              <!-- small highlight on hill -->
              <path d="M0 235 C70 215 110 215 200 235 C280 255 320 215 360 235 L360 260 L0 260 Z" fill="#cbe8a5" opacity="0.28"></path>
            </svg>
          </div>
        </div>

        <!-- right column: big centered title -->
        <div class="title-wrap">
          <h1 class="title">RISING SUNSET<br>ROBOTICS</h1>
          <div class="subtitle">Team Biography/History and Goal</div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-left">
        QUESTIONS?<br>
        <span class="contact">CONTACT: <strong>+1 (940)-279-3850</strong> OR</span>
      </div>

      <div class="footer-right">EMAIL: info@risingsunsetrobotics.com</div>
    </footer>

  </div>
</body>
</html>
